[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrsoft-video-extractor"
version = "0.6.11"
description = "VR Norte Studio: knowledge sync, local agent chat and VRSoft video extraction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "markdownify>=0.13.1",
  "Pillow>=10.4.0",
  "playwright>=1.45.0",
  "PySide6>=6.8.0",
  "pytesseract>=0.3.13",
  "python-dotenv>=1.0.1",
  "pyspellchecker>=0.9.0,<1",
  "tree-sitter==0.25.2",
  "tree-sitter-java==0.23.5",
  "yt-dlp>=2024.07.01"
]

[project.optional-dependencies]
semantic = [
  "onnxruntime==1.29.0",
  "tokenizers==0.23.2",
  "numpy==2.5.3",
]
dev = [
  "pyinstaller>=6.11.0",
  "pytest>=8.0.0",
  "ruff>=0.16.6,<0.17"
]

[project.scripts]
vrsoft-extractor = "vrsoft_extractor.cli:main"
vrsoft-extractor-gui = "vrsoft_extractor.mary.frontend.app:main"
vr-norte = "vrsoft_extractor.mary.cli:main"
vr-norte-studio = "vrsoft_extractor.mary.frontend.app:main"
# Compatibility aliases for existing development environments.
vr-mary = "vrsoft_extractor.mary.cli:main"
vr-mary-studio = "vrsoft_extractor.mary.frontend.app:main"

[tool.setuptools.packages.find]
include = ["vrsoft_extractor*"]

[tool.setuptools.package-data]
"vrsoft_extractor.mary" = [
    "assets/*",
    "data/*.md",
    "data/t3_themes.json",
    "data/t3_themes.LICENSE",
    "data/*.ps1",
    "data/*.cmd",
    "frontend/qml/*.qml",
    "frontend/qml/components/*.qml",
    "frontend/qml/pages/*.qml",
    "frontend/qml/theme/*",
    "frontend/qml/settings/appearance/*.qml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
faulthandler_timeout = 60
markers = [
  "qml: Qt/QML rendering and interaction checks (offscreen by default)",
  "research_timing: preserve production research pacing and retry delays",
]

[tool.ruff]
target-version = "py310"
extend-exclude = [".test-tmp", "reports", "VRProject"]

[tool.ruff.lint]
select = ["F", "E9"]
